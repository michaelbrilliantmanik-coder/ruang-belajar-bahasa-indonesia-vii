<script>
const CF=window.RB_CONFIG||{},$=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const B=[["b1","#0e8f98","🏔️","Jelajah Nusantara","Teks Deskripsi",1],["b2","#7c3aed","🧚","Berkelana di Dunia Imajinasi","Pantun dan Cerita Fantasi",0],["b3","#059669","🥗","Hal yang Baik bagi Tubuh","Teks Prosedur",0],["b4","#dc2626","🌍","Aksi Nyata Para Pelindung Bumi","Teks Berita",0],["b5","#ea580c","📚","Membuka Gerbang Dunia","Teks Tanggapan Buku",0],["b6","#0891b2","✉️","Sampaikan Melalui Surat","Surat Pribadi dan Resmi",0]];
const MOD=[["🎯","Tujuan Pembelajaran","Apa yang akan kamu kuasai."],["🎬","Video Pembelajaran","Animasi kartun lebih dari 2 menit."],["📖","Materi","Konsep lengkap, contoh, unduh PDF, presentasi."],["✏️","LKPD","Lembar kerja, isi online atau unduh."],["🎮","Game Petualangan","Level C1 sampai C6, skor, medali, dan sertifikat setelah game selesai."],["🏆","Kuis","Pretest dan postest."]];
const SANDI="1234567890";
/* ---- penyimpanan ---- */
const mem={};const LS={g(k,d){try{const v=localStorage.getItem("rb_"+k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},s(k,v){try{localStorage.setItem("rb_"+k,JSON.stringify(v))}catch(e){mem[k]=v}},d(k){try{localStorage.removeItem("rb_"+k)}catch(e){delete mem[k]}}};
let tt;const toast=t=>{const e=$("#tt");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2800)};
/* ---- pengiriman ke Google (antrean, kirim ulang otomatis) ---- */
let busy=false;
function stat(){const n=LS.g("antrean",[]).length;$("#st").textContent=!CF.SCRIPT_URL?"mode uji":n?"⏳ "+n+" menunggu":"✓ terkirim"}
async function flush(){if(busy||!CF.SCRIPT_URL)return;busy=true;let q=LS.g("antrean",[]);

$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};

render();stat();flush();
